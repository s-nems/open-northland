<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Okno misji · propozycje</title>
<!-- The runtime stylesheet, so every existing primitive looks as it does in the game. Served by serve.mjs
     from packages/app/src (see FOUNDATION.md, "Resume the local review"). -->
<link rel="stylesheet" href="/hud/dom/foundation.css">
<style>
@font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url(/fonts/alegreyasans-latin-400.woff2); }
@font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url(/fonts/alegreyasans-latinext-400.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: "Alegreya Sans"; font-weight: 500; src: url(/fonts/alegreyasans-latin-500.woff2); }
@font-face { font-family: "Alegreya Sans"; font-weight: 500; src: url(/fonts/alegreyasans-latinext-500.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url(/fonts/alegreyasans-latin-700.woff2); }
@font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url(/fonts/alegreyasans-latinext-700.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: Cinzel; font-weight: 400 900; src: url(/fonts/cinzel-latin.woff2); }
@font-face { font-family: Cinzel; font-weight: 400 900; src: url(/fonts/cinzel-latinext.woff2); unicode-range: U+0100-024F; }

body { margin: 0; background: #0b0f0d; color: #e8dcc0; font: 14px/1.4 "Alegreya Sans", system-ui, sans-serif; }
.review { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 14px; background: #151c19; border-bottom: 1px solid #3a3226; }
.review .row { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; flex-basis: 100%; }
.review b { color: #c9a262; font-weight: 700; margin-right: 4px; min-width: 76px; }
.review button { font: inherit; font-size: 13px; padding: 3px 9px; border: 1px solid #4d3b28; border-radius: 3px; background: #22201a; color: #e8dcc0; cursor: pointer; }
.review button[aria-pressed="true"] { background: #7a5f40; border-color: #c9a262; color: #fff4dc; }
.review .blurb { flex-basis: 100%; font-size: 13px; color: #c1baa8; min-height: 2.6em; }
.review .blurb strong { color: #efd28f; }
.stage { position: relative; width: 1365px; height: 768px; margin: 12px; overflow: hidden; background: #111 0 0 / 1365px 768px no-repeat; box-shadow: 0 0 0 1px #3a3226; }
.stage > .on-hud { --on-surface: url(/assets/ui/foundation/surface.png); --on-icons: url(/assets/ui/foundation/icons.png); pointer-events: auto; }
/* The captured world already carries the game's HUD beam and bars; a proposal's dim sits over it. */
</style>
<link rel="stylesheet" data-proposal-css>
</head>
<body>
<nav class="review" aria-label="Przegląd">
  <div class="row" data-proposals><b>Propozycja</b></div>
  <div class="row" data-views><b>Widok</b></div>
  <div class="row" data-maps><b>Misja</b></div>
  <div class="row" data-pages><b>Strona</b></div>
  <p class="blurb" data-blurb></p>
</nav>
<div class="stage" data-stage><div class="on-hud" data-hud></div></div>
<script type="module" src="mission/review.js"></script>
</body>
</html>
