<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zawód i szkoła — projekt UI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="professions.css">
</head>
<body>
  <header class="review-controls">
    <strong>Zawód i szkoła · projekt</strong>
    <label>Okno <select id="mode"><option value="school">Szkoła</option><option value="profession">Zmiana zawodu</option></select></label>
    <label>Osadnik <select id="person"><option value="smith">Kowal</option><option value="collector">Zbieracz</option><option value="group">Grupa · różne zawody</option></select></label>
    <label>Stan <select id="state"><option value="normal">Odkryte opcje</option><option value="early">Początek gry</option><option value="full">Pełna szkoła</option><option value="empty">Brak opcji</option><option value="long">Długi tekst</option></select></label>
    <label>Skala <select id="scale"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label>
    <button id="reopen" type="button">Otwórz ponownie</button>
  </header>
  <main id="stage" aria-label="Podgląd interfejsu"></main>
  <footer class="review-footer"><span id="result" role="status">Dane przykładowe. Kliknięcie pokazuje wybór, bez zmiany stanu gry.</span><a href="foundation.html">Fundament UI</a></footer>
  <script type="module" src="professions.js"></script>
</body>
</html>
