<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Panel pojazdu · makieta</title>
<!-- The runtime stylesheet itself, so every existing primitive looks as it does in the game. Served by
     serve.mjs from packages/app/src (see FOUNDATION.md, "Resume the local review"). -->
<link rel="stylesheet" href="/hud/dom/foundation.css">
<style>
@font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url(/fonts/alegreyasans-latin-400.woff2); }
@font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url(/fonts/alegreyasans-latinext-400.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: "Alegreya Sans"; font-weight: 500; src: url(/fonts/alegreyasans-latin-500.woff2); }
@font-face { font-family: "Alegreya Sans"; font-weight: 500; src: url(/fonts/alegreyasans-latinext-500.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url(/fonts/alegreyasans-latin-700.woff2); }
@font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url(/fonts/alegreyasans-latinext-700.woff2); unicode-range: U+0100-024F; }
@font-face { font-family: Cinzel; font-weight: 400 900; src: url(/fonts/cinzel-latin.woff2); }
@font-face { font-family: Cinzel; font-weight: 400 900; src: url(/fonts/cinzel-latinext.woff2); unicode-range: U+0100-024F; }

body { margin: 0; background: #0b0f0d; color: #e8dcc0; font: 14px/1.4 "Alegreya Sans", system-ui, sans-serif; }
.review { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 14px; background: #151c19; border-bottom: 1px solid #3a3226; }
.review b { color: #c9a262; font-weight: 700; margin-right: 4px; }
.review button { font: inherit; font-size: 13px; padding: 3px 9px; border: 1px solid #4d3b28; border-radius: 3px; background: #22201a; color: #e8dcc0; cursor: pointer; }
.review button[aria-pressed="true"] { background: #7a5f40; border-color: #c9a262; color: #fff4dc; }
.review label { font-size: 13px; color: #c1baa8; }
.review .note { flex-basis: 100%; font-size: 12.5px; color: #a79f8c; }
.stage { position: relative; width: 1365px; height: 768px; margin: 12px; overflow: hidden; background: #3f6a33 url(/vehicle-review/ships.png) 0 0 / 1365px 768px; box-shadow: 0 0 0 1px #3a3226; }
.stage[data-bg="carts"] { background-image: url(/vehicle-review/carts.png); }
.stage[data-bg="catapult"] { background-image: url(/vehicle-review/catapult.png); }
.stage .on-hud { --on-surface: url(/assets/ui/foundation/surface.png); --on-icons: url(/assets/ui/foundation/icons.png); }
.stage .on-selection { position: absolute; max-height: calc(100% - 64px); }

/* Mockup tip chip: the runtime's tip layer shows the same few words at the cursor after half a second. */
.chip { position: fixed; z-index: 99; max-width: 260px; padding: 4px 8px; border: 1px solid #7a5a2f; border-radius: 3px; background: linear-gradient(170deg, #ebdfc0, #d9c9a4); color: #2b2317; font-size: 12.5px; line-height: 1.3; pointer-events: none; box-shadow: 0 6px 14px #000a; }
.chip[hidden] { display: none; }

/* The portrait shows a crop of a capture here; in game the renderer paints the live vehicle through the hole. */
.on-hud .on-portrait__frame.vx-shot { background-repeat: no-repeat; cursor: pointer; }
</style>
</head>
<body>
<nav class="review" aria-label="Stany do przeglądu">
  <b>Pojazd</b>
  <button type="button" data-state="handcart" aria-pressed="true">Wózek z kupcem</button>
  <button type="button" data-state="oxcart">Wóz z tragarzem</button>
  <button type="button" data-state="picker">Wóz · dodaj towar</button>
  <button type="button" data-state="oxcart-empty">Wóz bez woźnicy</button>
  <button type="button" data-state="ship-moored">Mały statek w porcie</button>
  <button type="button" data-state="ship-sea">Duży statek na morzu</button>
  <button type="button" data-state="aboard">Wóz na statku</button>
  <button type="button" data-state="catapult">Katapulta</button>
  <button type="button" data-state="foreign">Obcy statek</button>
  <p class="note">Makieta: dane przykładowe, portret to wycinek zrzutu (w grze renderer maluje żywy pojazd przez otwór). Style pochodzą z foundation.css gry. Najedź na kontrolkę, żeby zobaczyć jej podpowiedź.</p>
</nav>
<div class="stage" data-stage><div class="on-hud" data-hud></div></div>
<div class="chip" data-chip hidden></div>
<script type="module" src="vehicle.js"></script>
</body>
</html>
