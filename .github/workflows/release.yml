name: Release

# Manually-dispatched build of everything one commit ships - the desktop installers and the web
# container image - so the two halves always come from the same source. Run it from the Actions tab
# against main (optionally an older commit via the `commit` input).
#
# Each OS builds its own installers natively, then `publish` collects them into a `build-<short-sha>`
# prerelease: release assets are plain public download links, unlike workflow artifacts which require
# a GitHub login. There is no semver release train yet; the version IS the commit
# (0.0.0-<short-sha>), stamped via electron-builder extraMetadata.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the commit to build (defaults to the branch head)
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Both halves publish under names that look official, so neither may build an object that is not on
  # main: the `commit` input can otherwise name anything in the repo network, fork-PR heads included.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.ref }}
          fetch-depth: 0
      - name: Refuse to build a commit that is not on main
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main

  installers:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Derive the build version from the commit
        id: version
        shell: bash
        run: echo "version=0.0.0-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - run: npm run dist --workspace @open-northland/desktop -- --config.extraMetadata.version=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ runner.os }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
          if-no-files-found: error

  image:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.ref }}
      - name: Name the image after the commit
        id: image
        run: |
          repository="ghcr.io/${{ github.repository }}-web"
          echo "tags=$repository:latest,$repository:sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One architecture into the local daemon first: the smoke test needs an image it can run, and
      # an image that fails its own deployment contract must not reach the registry.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: open-northland-web:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: node packages/web/scripts/smoke-image.mjs open-northland-web:smoke
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha

  publish:
    needs: [installers, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true
      - name: Publish the build-<short-sha> prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short=7 HEAD)"
          tag="build-$short"
          # Re-dispatching the same commit replaces that build's assets instead of failing.
          if gh release view "$tag" --json tagName --jq .tagName >/dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            # Quoted heredoc + sed keeps the markdown literal (backticks, fences) with only the
            # sha substituted.
            sed -e "s/@SHA@/$sha/" -e "s/@SHORT@/$short/" > notes.md <<'EOF'
          Unsigned development build of commit @SHA@ - code signing is tracked in docs/tickets/tooling/desktop-code-signing.md.

          - **Windows:** SmartScreen warns about an unknown publisher; choose "More info" → "Run anyway".
          - **macOS:** Gatekeeper refuses to open the unsigned app - on Apple Silicon as a misleading "damaged, move to Trash" dialog. The app is fine; after copying OpenNorthland.app to Applications, clear the download quarantine flag and launch again:

            ```sh
            xattr -cr /Applications/OpenNorthland.app
            ```

          The browser deployment of the same commit:

          ```sh
          docker pull ghcr.io/s-nems/open-northland-web:sha-@SHORT@
          ```
          EOF
            gh release create "$tag" installers/* \
              --prerelease \
              --target "$sha" \
              --title "Dev build $short" \
              --notes-file notes.md
          fi
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "Download page: $url" >> "$GITHUB_STEP_SUMMARY"
