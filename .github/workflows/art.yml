name: Art

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: art-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: git fetch https://github.com/s-nems/open-northland.git main:refs/remotes/upstream/main
      - run: node scripts/custom-fork-guard.mjs upstream/main
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:art
      - run: npm run art -- build all
      - run: npm run art -- validate all
