<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dyplomacja — projekt panelu</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <header class="study-bar">
      <div><strong>DYPLOMACJA / STUDIUM UX</strong><span>Przykładowe dane · interakcje demonstracyjne</span></div>
      <label>Scenariusz <select id="scenario">
        <option value="standard">Relacje i trybuty</option>
        <option value="empty">Brak poznanych narodów</option>
        <option value="observer">Obserwator</option>
        <option value="long">Długie nazwy i wiele trybutów</option>
        <option value="rejected">Odrzucona komenda</option>
      </select></label>
      <label><input id="stocked" type="checkbox" /> Pełne zapasy</label>
      <button id="reset" type="button">Przywróć dane</button>
    </header>
    <main id="stage" aria-label="Podgląd panelu dyplomacji"></main>
    <footer class="study-footer">Projekt do oceny · wspólna rama, materiały, ikony i typografia HUD-u</footer>
    <script type="module" src="./study.js"></script>
  </body>
</html>
