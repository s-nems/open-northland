# Packaging for the desktop shell. Builds are unsigned.
appId: org.opennorthland.desktop
productName: OpenNorthland
# electron-builder needs an exact Electron release to fetch platform binaries; keep in lockstep
# with the devDependency.
electronVersion: 45.1.0
directories:
  output: release
  # Installer inputs (the app icons); `build/`, electron-builder's default, reads like an output.
  buildResources: resources
files:
  - dist/**
  - package.json
extraResources:
  # The built web app and the converted content ride as plain resources (resources/app,
  # resources/content) - both are served by the app:// protocol, not loaded as Electron code.
  - from: ../app/dist
    to: app
  - from: ../../content
    to: content
    filter:
      - '**/*'
      - '!data.zip'
      - '!.data-unpacked'
      - '!.data-unpacked/**'
      - '!.data-unpacked.sha256'
win:
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # The portable exe is packaged by electron-builder-portable.yml.
  target:
    - target: nsis
      arch: [x64]
# Space-free artifact names, so they work as download URLs.
nsis:
  # A game install: let the player pick the directory, real shortcuts, no one-click surprise.
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.exe
  installerIcon: icon-installer.ico
  uninstallerIcon: icon-uninstaller.ico
  include: installer.nsh
portable:
  artifactName: ${productName}-${version}-portable.exe
  splashImage: resources/portable-splash.bmp
mac:
  # arm64 pinned because the default is the build host's arch. An Intel dmg costs a whole extra mac
  # build; `--mac dmg:x64 dmg:arm64` adds it and replaces this list.
  target:
    - target: dmg
      arch: [arm64]
  identity: null
  artifactName: ${productName}-${version}-${arch}.dmg
dmg:
  # The mounted volume's icon.
  icon: icon-installer.icns
linux:
  # Without this the executable defaults to the scoped package name (@open-northland/desktop),
  # whose "@" electron-builder rejects as unsafe in file paths.
  executableName: OpenNorthland
  target:
    - AppImage
  category: Game
  artifactName: ${productName}-${version}-${arch}.AppImage
