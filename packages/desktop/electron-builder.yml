# Packaging for the desktop shell. Builds are unsigned.
appId: org.opennorthland.desktop
productName: OpenNorthland
# electron-builder needs an exact Electron release to fetch platform binaries; keep in lockstep
# with the devDependency.
electronVersion: 43.1.1
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  # The built web app and the converted content ride as plain resources (resources/app,
  # resources/content) - both are served by the app:// protocol, not loaded as Electron code.
  - from: ../app/dist
    to: app
  - from: ../../content
    to: content
    filter:
      - '**/*'
      - '!cnmod.zip'
      - '!.cnmod-unpacked'
      - '!.cnmod-unpacked/**'
      - '!.cnmod-unpacked.sha256'
win:
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
# Space-free artifact names: these become GitHub release asset URLs (.github/workflows/release.yml).
nsis:
  # A game install: let the player pick the directory, real shortcuts, no one-click surprise.
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.exe
portable:
  artifactName: ${productName}-${version}-portable.exe
mac:
  # arm64 pinned for the same reason as win x64: the default is the build host's arch. An Intel dmg
  # costs a whole extra mac build, so the release adds it on request with
  # `--mac dmg:x64 dmg:arm64`, which replaces this list.
  target:
    - target: dmg
      arch: [arm64]
  identity: null
  artifactName: ${productName}-${version}-${arch}.dmg
linux:
  # Without this the executable defaults to the scoped package name (@open-northland/desktop),
  # whose "@" electron-builder rejects as unsafe in file paths.
  executableName: OpenNorthland
  target:
    - AppImage
  category: Game
  artifactName: ${productName}-${version}-${arch}.AppImage
