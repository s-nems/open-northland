# The deployment contract in AGENTS.md as configuration: the site at the origin root, the app under
# /play/, and a cache lifetime per file that follows whether its name carries a content hash.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS terminates in front of this container, so a redirect must not name a scheme of its own.
    absolute_redirect off;

    gzip on;
    # Both spellings of the script type: which one nginx's mime map uses has changed between releases.
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # Everything but the hashed app assets ships under a fixed name and must revalidate. A stale
    # sw.js keeps serving old logic until the visitor clears their storage.
    add_header Cache-Control "no-cache" always;

    location /play/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Same origin by contract, never in this image: the proxy in front serves the mod archive.
    # Reaching this line means the origin is misconfigured, not that the archive is missing.
    location = /cnmod.zip {
        default_type text/plain;
        return 404 "this origin must serve the CulturesNation archive at /cnmod.zip\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
