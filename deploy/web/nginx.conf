# A cached 404 for a hashed asset one replica lacks would be unrecoverable.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/open-northland;

    # A types block replaces the inherited map, hence the include.
    include /etc/nginx/mime.types;
    types {
        audio/wav wav;
        image/x-icon cur;
    }

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
    }

    location ~ /\. {
        return 404;
    }

    location = /healthz {
        access_log off;
        types { }
        default_type text/plain;
        return 200 "ok\n";
    }
}
