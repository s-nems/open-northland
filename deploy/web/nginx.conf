# The app and the content share one document root and are all static files: the page answers the
# root alone, so a missing content file is a plain 404 and never the app's index.html.

# Only a hashed asset that exists may live in a cache for good: a cached 404 for a chunk one replica
# does not have yet would be unrecoverable, and a 404 without a header is heuristically cacheable.
map $status $assets_cache_control {
    200     "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /srv/open-northland;

    # A types block replaces the inherited map rather than extending it, hence the include: the two
    # additions are what the content carries that the stock map has no entry for.
    include /etc/nginx/mime.types;
    types {
        audio/wav wav;
        image/x-icon cur;
    }

    gzip on;
    # The default is "off", which means no compression at all once a proxy in front adds Via.
    gzip_proxied any;
    gzip_vary on;
    # Both spellings of the script type: which one nginx's mime map uses has changed between releases.
    gzip_types text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;

    # The content and the page ship under fixed names and must revalidate; only the hashed app assets
    # may live in a cache for good. A location with its own add_header drops every header inherited
    # from here, so the block below repeats nothing else.
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $assets_cache_control always;
    }

    # Vite's build manifest and any other dotfile are not part of the served app.
    location ~ /\. {
        return 404;
    }

    location = /healthz {
        access_log off;
        types { }
        default_type text/plain;
        return 200 "ok\n";
    }
}
