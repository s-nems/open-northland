# The reverse proxy in front of the relay container: TLS for the subdomain, the WebSocket upgrade
# passed through unchanged, and the health check reachable over HTTPS. Replace the server name and
# the certificate paths with the deployment's own.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name relay.opennorthland.org;

    ssl_certificate     /etc/letsencrypt/live/relay.opennorthland.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.opennorthland.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A relayed game is one long-lived connection with a ping every second in each direction, so
        # a minute of silence means the peer is gone, not idle.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.opennorthland.org;
    return 301 https://$host$request_uri;
}
